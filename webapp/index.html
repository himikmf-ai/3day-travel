<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>3 дня в Сочи</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>3 дня в Сочи</h1>
      <p>Море, Олимпийский парк и горы.</p>
    </header>

    <!-- Фильтр предпочтений -->
    <section id="preferences" class="preferences-section">
      <h3>Настройте предпочтения</h3>
      
      <div class="preference-group">
        <label>Природа:</label>
        <div class="preference-options">
          <button class="pref-btn" data-pref="landscape" data-type="nature">🌊 Море</button>
          <button class="pref-btn" data-pref="mountains" data-type="nature">⛰️ Горы</button>
        </div>
      </div>

      <div class="preference-group">
        <label>Формат отдыха:</label>
        <div class="preference-options">
          <button class="pref-btn" data-pref="relaxing" data-type="activity">🧘 Спокойный</button>
          <button class="pref-btn" data-pref="active" data-type="activity">🏃 Активный</button>
        </div>
      </div>

      <div class="preference-group">
        <label>Транспорт:</label>
        <div class="preference-options">
          <button class="pref-btn" data-pref="car" data-type="transport">🚗 Машина</button>
          <button class="pref-btn" data-pref="public" data-type="transport">🚌 Общественный</button>
        </div>
      </div>

      <button id="reset-filters" class="reset-btn">Сбросить фильтры</button>
    </section>

    <section id="days-tabs">
      <button class="tab active" data-day="1">День 1</button>
      <button class="tab" data-day="2">День 2</button>
      <button class="tab" data-day="3">День 3</button>
    </section>

    <section id="day-content">
    </section>

    <footer>
      <button id="save-trip">Отправить маршрут</button>
    </footer>
  </div>

  <script src="./main.js"></script>
</body>
</html>
